name: Pinned model validation

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Validation tier
        type: choice
        options: [model, release]
        default: model

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, nathr-model-cache]
    env:
      NATHR_CACHE: ${{ vars.NATHR_VALIDATION_CACHE }}
      NATHR_CORES: ${{ vars.NATHR_VALIDATION_CORES }}
      NATHR_SMT_CORES: ${{ vars.NATHR_VALIDATION_SMT_CORES }}
      NATHR_ONE_CORE: ${{ vars.NATHR_VALIDATION_ONE_CORE }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and test offline
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 4
          ctest --preset release
      - name: Install the reference lock from the local cache
        run: |
          test -n "$NATHR_CACHE"
          export UV_CACHE_DIR="$NATHR_CACHE/uv-cache"
          uv venv --offline --python 3.12 build/reference-env
          uv pip sync --offline --require-hashes --index https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match --python build/reference-env/bin/python reference/requirements.lock
      - name: Check the whole frozen inventory and rounded caches
        run: |
          build/reference-env/bin/python reference/phase5_verify.py --binary build/release/nathr \
            --tests build/release/nathr_tests --native "$NATHR_CACHE/hf" --published "$NATHR_CACHE/models" \
            --controlled "$NATHR_CACHE/controlled" --extended "$NATHR_CACHE/extended" \
            --untied "$NATHR_CACHE/untied.f32.gguf" --llama-probe "$NATHR_CACHE/llama-probe" \
            --llama-source "$NATHR_CACHE/llama-source" --ggml-bridge "$NATHR_CACHE/ggml-blocks.so" \
            --work build/validation
      - name: Exercise the real full-context boundary
        if: inputs.tier == 'release'
        run: |
          build/release/nathr bench --model "$NATHR_CACHE/controlled/SmolLM2.Q4_0.gguf" \
            --backend auto --threads 4 --kv-cache f16 --prefill-chunk 32 \
            --context 8192 --prompt-length 8191 --decode-length 1 --warmups 0 --repetitions 1 --json \
            >build/validation/full-context.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/validation/full-context.json').read_text())
          if (report['prompt_length'] + report['decode_length'] != report['context']
              or report['context'] != 8192 or report['kv_cache_dtype'] != 'F16'
              or report['kv_cache_bytes'] != 188743680 or report['inter_token_samples'] != 1):
              raise SystemExit('Real FP16 full-context validation did not reach the expected boundary')
          PY
      - name: Record release timings on the controlled runner
        if: inputs.tier == 'release'
        run: |
          (
            cd "$NATHR_CACHE" || exit
            sha256sum --check --strict <<'SHA256'
          991ed1cd6a2d40d6d0be3d8d0954b6178a91aa0caacc93fa472ded6eadeddff4  phase2-bin
          ff9d045b98977aee583e309b4a35561055386dd7a4766d42eeb6cd18e969624e  phase2-probes
          b3f492fd7cffa54a41e29c36a0bb034adfd98f64e3b76faa88c0db055611a9eb  phase3-baseline
          SHA256
          )
          python3 reference/phase2_bench.py --binary "$NATHR_CACHE/phase2-bin" \
            --probes "$NATHR_CACHE/phase2-probes" --controlled "$NATHR_CACHE/controlled" \
            --cpu "$NATHR_ONE_CORE" --output build/validation/phase2-timing.json
          python3 reference/phase5_bench.py --binary build/release/nathr --native "$NATHR_CACHE/hf" \
            --controlled "$NATHR_CACHE/controlled" --output build/validation/sustained.json \
            --cpus "$NATHR_CORES" --warmups 2 --repetitions 7
          python3 reference/phase4_bench.py --baseline "$NATHR_CACHE/phase3-baseline" \
            --binary build/release/nathr --controlled "$NATHR_CACHE/controlled" \
            --llama-probe "$NATHR_CACHE/llama-probe" --physical "$NATHR_CORES" --smt "$NATHR_SMT_CORES" \
            --one-core "$NATHR_ONE_CORE" --output build/validation/matched.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          work = Path('build/validation')
          report = json.loads((work / 'report.json').read_text())
          slice_models = json.loads((work / 'phase2-timing.json').read_text())['models']
          timing = json.loads((work / 'matched.json').read_text())
          expected = ('blocked_vs_phase3_avx2', 'blocked_vs_repeated_prefill')
          models = timing['models']
          failures = []
          if not report['avx2_tested']:
              failures.append('AVX2 validation')
          if set(slice_models) != {'Q4_0', 'Q8_0'} or not all(
              item['performance_passed'] for item in slice_models.values()
          ):
              failures.append('Phase 2 scalar / AVX2 timing')
          if set(models) != {'f32', 'Q4_0', 'Q8_0'} or not all(
              item[key]['performance_passed'] for item in models.values() for key in expected
          ):
              failures.append('Phase 4 matched timing')
          if failures:
              raise SystemExit('Required release gates failed: ' + ', '.join(failures))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nathr-validation-${{ inputs.tier }}
          path: |
            build/validation/*.json
            build/validation/native/report.json
            build/validation/phase2/report.json
